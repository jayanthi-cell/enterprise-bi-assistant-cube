cubes:
  - name: dim_product
    sql_table: enterprise_ai.gold.dim_product
    public: false

    dimensions:
      - name: product_id
        sql: product_id
        type: string
        primary_key: true

      - name: vehicle_maker
        sql: vehicle_maker
        type: string

      - name: vehicle_model
        sql: vehicle_model
        type: string

      - name: vehicle_color
        sql: vehicle_color
        type: string

      - name: vehicle_model_year
        sql: vehicle_model_year
        type: number

      - name: list_price
        sql: vehicle_price
        type: number
        title: Vehicle List Price

    measures:
      - name: count
        type: count
